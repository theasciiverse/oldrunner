# Asciiverse release workflow (tag v* or run by hand with a tag)
# Builds Oldrunner for the Asciiverse catalog: one archive per target,
# named oldrunner-<target>.tar.gz, plus a SHA256SUMS file, attached to a
# GitHub release (hub/catalog/SCHEMA.md, release.source = "github"), and
# .deb, .rpm, .apk and Arch packages from the Linux binaries (nfpm,
# asciiverse/nfpm.yaml). Runs on a v*-av.* tag, or by hand for an
# existing tag.
#
# Linux builds run in Alpine and link ncurses statically (-musl triples).
# macOS links the system ncurses. No Windows build (POSIX curses,
# gettimeofday, fgetln).

name: release

on:
  push:
    tags: ["v*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base ncurses-dev ncurses-static &&
            STATIC=1 asciiverse/build.sh &&
            asciiverse/package.sh ${{ matrix.target }} &&
            chown -R '"$(id -u):$(id -g)"' . '
          file oldrunner

      - name: System packages
        run: |
          v="${TAG#v}"; export VERSION="${v%%-av.*}" RELEASE="${v##*-av.}" ARCH=${{ matrix.arch }}
          for p in deb rpm apk archlinux; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
              -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
              package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          CC="cc -arch ${{ matrix.arch }}" asciiverse/build.sh
          file oldrunner
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Oldrunner $TAG" \
                 --notes "Oldrunner by Frederic Culot (github.com/culot/oldrunner), with 150 levels of its own, built for the Asciiverse catalog, with .deb, .rpm, .apk and Arch packages. Changes: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
