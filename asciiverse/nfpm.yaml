# System packages (.deb, .rpm, .apk, Arch) for Oldrunner, built by nfpm
# from the same static binary as the av archive. The release workflow sets
# VERSION, RELEASE (our packaging release) and ARCH (amd64 or arm64).
#
# No .desktop file on purpose: av is the one place titles are started from.
name: oldrunner
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: games
priority: optional
maintainer: Asciiverse <packages@asciiverse.sh>
vendor: Asciiverse
homepage: https://github.com/theasciiverse/oldrunner
license: BSD-2-Clause
description: |
  Gold-running platform game for the terminal.
  Run, climb ladders, swing along ropes and dig holes to trap the guards
  while you collect every bag of gold, then climb out by the escape
  ladder. 150 levels. By Frederic Culot, packaged by Asciiverse.
contents:
  - src: oldrunner
    dst: /usr/bin/oldrunner
    file_info: { mode: 0755 }
  - src: oldrunner.6
    dst: /usr/share/man/man6/oldrunner.6
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/doc/oldrunner/copyright
    file_info: { mode: 0644 }
  - src: PATCHES.md
    dst: /usr/share/doc/oldrunner/PATCHES.md
    file_info: { mode: 0644 }
